name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: services/auth-service
        run: mvn -B test

  # Nombrado "crdb-tests" a proposito (ver estructura de repositorio de la Guia de
  # Entrega 3, Listing 3): incluye las pruebas de integracion con Testcontainers
  # que levantan un CockroachDB real en Docker (ver
  # src/test/.../integration/TicketRepositoryIntegrationTest.java) -- los
  # runners de GitHub Actions en ubuntu-latest traen Docker preinstalado, asi
  # que Testcontainers funciona sin configuracion adicional.
  crdb-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test (incluye Testcontainers)
        working-directory: services/svc-principal
        run: mvn -B test

  report-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn test
        working-directory: services/report-service
        run: mvn -B test

  notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/notification-service/package.json
      - name: npm install
        working-directory: services/notification-service
        run: npm install
      - name: npm test
        working-directory: services/notification-service
        run: npm test

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install
        working-directory: services/ai-service
        run: pip install -r requirements.txt
      - name: pytest
        working-directory: services/ai-service
        run: python -m pytest tests/ -v
