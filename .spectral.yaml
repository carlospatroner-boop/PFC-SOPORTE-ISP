extends: ["spectral:oas"]

rules:
  oas3-api-servers: off
  info-contact: off
  # Fuera de alcance de esta correccion (E4/OpenAPI): completar operationId, description y tags
  # globales en las 17 operaciones es trabajo de documentacion aparte, no de completitud del
  # contrato. Se desactivan para que el log del CI quede enfocado en lo que si se exige aqui.
  operation-description: off
  operation-operationId: off
  operation-tag-defined: off

  # Regla propia: toda respuesta de exito (2xx) debe declarar content + schema. Sin esto, el
  # contrato puede describir solo la descripcion en prosa de una operacion sin comprometerse a
  # una forma verificable -- que es justo el hueco que senalo el profesor en la Entrega 4 (4 de
  # 17 operaciones sin esquema de respuesta; al revisar el resto, en realidad eran 11 de 17).
  response-schema-required:
    description: Toda respuesta 2xx debe declarar content.application/json.schema
    message: "{{property}} no declara content/schema en su respuesta de exito"
    severity: error
    given: "$.paths[*][*].responses[?(@property.match(/^2/))]"
    then:
      field: content
      function: truthy
