server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html -- necesario porque
    # el enrutamiento (/main, /settings, /about) lo resuelve React Router en el cliente,
    # no nginx. Sin esto, recargar la pagina en /settings daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
