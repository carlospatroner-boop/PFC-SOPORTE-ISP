# Provisiona el dashboard versionado (ops/grafana/pfc-dashboard.json) automaticamente,
# para que "docker compose up" lo deje disponible sin importarlo a mano en la UI.
apiVersion: 1

providers:
  - name: "PFC Soporte ISP"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
