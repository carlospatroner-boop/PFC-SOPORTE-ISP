# Datasources provisionados automaticamente al arrancar Grafana -- asi "docker compose up"
# deja todo listo sin configuracion manual (D9.4: reproducibilidad).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: ""
      serviceMap:
        datasourceUid: "prometheus"
