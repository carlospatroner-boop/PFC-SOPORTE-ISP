syntax = "proto3";

package ec.edu.uteq.soporte.telemetryservice.grpc;

option java_multiple_files = true;
option java_package = "ec.edu.uteq.soporte.telemetryservice.infrastructure.grpc";
option java_outer_classname = "TelemetryProto";

// PE-U1 (equipo ACC): consulta del registro de telemetria de una zona, ya ordenado
// causalmente con el reloj de Lamport del servidor de sockets. Este RPC es el punto de
// consumo que usara mas adelante la estrategia CORREL en modo "c2" -- ver
// docs/adr/0007-pe-u1-telemetria.md. No hay todavia ningun consumidor cableado a este
// servicio; queda listo para esa integracion futura.
service TelemetryService {
  rpc GetEventosPorZona(ZonaWindowRequest) returns (EventosResponse);
}

message ZonaWindowRequest {
  string zone = 1;
  // Ventana deslizante hacia atras desde "ahora", en segundos. 0 = sin limite (todo lo
  // que el buffer en memoria todavia conserve para esa zona).
  int64 window_seconds = 2;
}

message TelemetryEventProto {
  string type = 1;           // "EQUIPO" | "NODO"
  string origin_id = 2;      // id del equipo del abonado, o nombre del nodo (node1/node2/node3)
  string zone = 3;
  int64 lamport_timestamp = 4;
  int64 received_at_epoch_ms = 5;
  string payload_json = 6;   // el "payload" original que envio el cliente, tal cual (JSON crudo)
}

message EventosResponse {
  // Ordenados por lamport_timestamp ascendente: es el orden causal, no el de llegada.
  repeated TelemetryEventProto events = 1;
}
